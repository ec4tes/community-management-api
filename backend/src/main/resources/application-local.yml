spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/hsd_db}
    username: ${LOCAL_DB_USERNAME:postgres}
    password: ${LOCAL_DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8000

app:
  jwt:
    secret: ${LOCAL_JWT_SECRET:batHzQ0L3LZgj0vgw0tqT7OimtXpixO3zkk33R30R3u}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000}